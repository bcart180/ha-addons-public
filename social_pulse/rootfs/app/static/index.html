<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Social Pulse</title>
<link rel="stylesheet" href="soft-slate.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<main class="shell wide">
  <header class="header">
    <div class="logo" aria-hidden="true">◎</div>
    <div>
      <h1>Social Pulse</h1>
      <div class="sub" id="updated">Loading…</div>
    </div>
    <div class="seg" role="tablist" aria-label="Range">
      <button class="on" data-range="7d">7 days</button>
      <button data-range="30d">30 days</button>
    </div>
  </header>
  <section id="hero" class="hero"></section>
  <h2 class="sec">X accounts</h2>
  <section id="x" class="grid"></section>
  <h2 class="sec">Websites</h2>
  <section id="sites" class="grid two"></section>
  <h2 class="sec">Not available, and why</h2>
  <section id="na" class="card na-list"></section>
  <footer class="footer">Read-only. Data from X API v2 public metrics and Cloudflare GraphQL Analytics. Nothing here is estimated.</footer>
</main>
<script src="app.js"></script>
</body>
</html>
