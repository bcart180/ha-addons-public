name: Social Pulse
version: "0.3.2"
slug: social_pulse
description: Read-only X engagement and Cloudflare edge traffic, plus sampled Web Analytics when the token allows (Ingress panel)
url: https://github.com/bcart180/ha-addons-public/tree/main/social_pulse
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
# Sidebar panel behind the HA login. No host ports are published.
ingress: true
ingress_port: 8099
panel_icon: mdi:chart-areaspline
panel_title: Social Pulse
panel_admin: true
# No Home Assistant API, no /config, no /share. Nothing is written outside /data.
homeassistant_api: false
backup: hot
watchdog: http://[HOST]:[PORT:8099]/api/health
options:
  # One line per X handle, set in the Configuration tab, e.g.:
  #   - example_handle
  x_accounts: []
  # Set your own Cloudflare account ID and zones in the Configuration tab. Example zone entry:
  #   - name: example.com
  #     zone_id: <32 hex>
  #     rum_site_tag: <32 hex>
  zones: []
  refresh_minutes: 30
  log_level: info
schema:
  # Secrets: password fields only, entered at install time. Never in the repo.
  x_bearer_token: password?
  cloudflare_api_token: password?
  x_accounts:
    - match(^[A-Za-z0-9_]{1,15}$)
  cloudflare_account_id: match(^[a-f0-9]{32}$)?
  zones:
    - name: str
      zone_id: match(^[a-f0-9]{32}$)
      rum_site_tag: match(^[a-f0-9]{32}$)?
  refresh_minutes: int(15,1440)
  snapshot_file: str?
  log_level: list(debug|info|warning|error)
