name: CallCatch
version: "0.8.9"
slug: voicemail
description: Your Personalized Voicemail. iPhone-style house inbox (list + detail) via Supervisor ingress
url: https://github.com/bcart180/ha-addons-public/tree/main/voicemail
arch:
  - aarch64
  - amd64
init: false
# Sidebar panel behind the HA login. No host ports published. Never public.
ingress: true
ingress_panel: true
panel_admin: true
panel_icon: mdi:voicemail
panel_title: CallCatch
homeassistant_api: true
map:
  # Read-only, so the one-time pyscript import cannot write the config folder.
  - homeassistant_config:ro
  - share:rw
  - media:rw
# Private carrier audio under /data/callcatch/recordings.  Not part of a backup.
backup_exclude:
  - callcatch/recordings
  - callcatch/recordings/*
options:
  sensor_entity: sensor.inbound_voicemails
  media_player: ""
  audio_dir: ""
  mock: false
  log_level: info
  ingest_token: ""
  legacy_pyscript: auto
  storage_backend: local
  keep_local_copy: true
  google_drive_folder_id: ""
  google_service_account_json: ""
  google_oauth_client_id: ""
  google_oauth_client_secret: ""
  google_oauth_refresh_token: ""
  voice_trust_url: ""
  voice_trust_token: ""
  contacts_sync_enabled: false
  icloud_apple_id: ""
  icloud_app_password: ""
  contacts_sync_interval_min: 30
  contacts_drop_import: false
  agent_token: ""
  agent_inactivity_s: 180
  hook_expected: false
  hook_grace_s: 120
  freebusy_calendars: "calendar.home,calendar.shared"
  freebusy_window: "08:00-18:00"
  mail_backend: "off"
  mail_to: ""
  agentmail_inbox: ""
  agentmail_api_key: ""
  agentmail_domain_setup: false
  email_full_number: false
  gdit_work_copy: false
  panel_base_url: ""
  push_service: ""
  late_update_push: true
  timeout_notify_per_day: 20
  telnyx_api_key: ""
  telnyx_connection_ids: ""
  telnyx_delete_remote: true
  telnyx_poll_s: 30
  xai_api_key: ""
  xai_stt_model: "grok-voice-transcribe-2.0"
  recording_grace_s: 180
schema:
  sensor_entity: str
  media_player: str?
  audio_dir: str?
  mock: bool
  log_level: list(debug|info|warning|error)
  ingest_token: password
  legacy_pyscript: list(auto|on|off)
  storage_backend: list(local|google_drive)
  keep_local_copy: bool
  google_drive_folder_id: str?
  google_service_account_json: password
  google_oauth_client_id: str?
  google_oauth_client_secret: password
  google_oauth_refresh_token: password
  voice_trust_url: str?
  voice_trust_token: password
  contacts_sync_enabled: bool
  icloud_apple_id: str?
  icloud_app_password: password?
  contacts_sync_interval_min: int(15,1440)
  contacts_drop_import: bool
  agent_token: password?
  agent_inactivity_s: int(60,1800)
  hook_expected: bool
  hook_grace_s: int(0,900)
  freebusy_calendars: str
  freebusy_window: match(^\d{1,2}:\d{2}-\d{1,2}:\d{2}$)
  mail_backend: list(off|agentmail)
  mail_to: match(^[A-Za-z0-9._+\-]{1,64}@(proton\.me|protonmail\.com)$)?
  agentmail_inbox: match(^(?:callcatch[a-z0-9._\-]{0,55}@agentmail\.to|callcatch@callcatch\.brysoncarter\.com)$)?
  agentmail_api_key: password?
  agentmail_domain_setup: bool
  email_full_number: bool
  gdit_work_copy: bool
  panel_base_url: match(^https?://[A-Za-z0-9.\-]{1,253}(:\d{1,5})?/?$)?
  push_service: str?
  late_update_push: bool
  timeout_notify_per_day: int(1,200)
  telnyx_api_key: password?
  telnyx_connection_ids: match(^[0-9, ]{0,400}$)?
  telnyx_delete_remote: bool
  telnyx_poll_s: int(15,300)
  xai_api_key: password?
  xai_stt_model: str?
  recording_grace_s: int(30,900)
