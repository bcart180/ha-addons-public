configuration:
  sensor_entity:
    name: Voicemail sensor
    description: >-
      Entity CallCatch publishes for dashboards and notifications.
      State is the message count. Attributes voicemails and recent_items
      hold the latest messages. Default sensor.inbound_voicemails.
  media_player:
    name: Speaker
    description: >-
      Optional media_player entity for the speaker button. Leave blank to
      play only inside CallCatch. There is no default player.
  audio_dir:
    name: Legacy audio directory
    description: >-
      Optional read-only folder for recordings already on disk.
      New recordings are stored under Media or Share (callcatch/), never /local.
  mock:
    name: Mock inbox
    description: Show the built-in sample inbox when CallCatch is not running inside Home Assistant.
  log_level:
    name: Log level
    description: How much CallCatch writes to the App log. Tokens and keys are never written.
  ingest_token:
    name: Ingest token
    description: >-
      Bearer token for POST /api/ingest, sent only as Authorization: Bearer.
      Set the same value as CallCatch Voice ha_webhook_token. Leave empty to
      refuse ingest. Stored as a password and never written to the log.
  legacy_pyscript:
    name: Legacy pyscript mode
    description: >-
      auto uses the pyscript inbox services when
      /homeassistant/pyscript/.inbound_voicemails.json or
      /config/pyscript/.inbound_voicemails.json exists. on keeps that path.
      off uses CallCatch's own store and imports the legacy file once, read-only.
  storage_backend:
    name: Storage backend
    description: >-
      local keeps audio under /media/callcatch or /share/callcatch.
      google_drive uploads each recording and its transcript JSON to a
      Drive folder with the drive.file scope only.
  keep_local_copy:
    name: Keep local copy
    description: >-
      When storage is google_drive, also keep the audio file on disk.
      Playback can stream from Drive through CallCatch when this is off.
      Ignored for local storage.
  google_drive_folder_id:
    name: Google Drive folder ID
    description: >-
      Drive folder that receives each voicemail's audio and transcript JSON.
      CallCatch does not create public sharing links.
  google_service_account_json:
    name: Google service account JSON
    description: >-
      Full JSON key for a service account. Password field. Prefer this or the
      OAuth refresh token, not both. The private key is never logged.
      Scope used is https://www.googleapis.com/auth/drive.file only.
  google_oauth_client_id:
    name: Google OAuth client ID
    description: OAuth client id used with the refresh token. Not required when a service account JSON is set.
  google_oauth_client_secret:
    name: Google OAuth client secret
    description: OAuth client secret. Password field. Never logged. Not required when a service account JSON is set.
  google_oauth_refresh_token:
    name: Google OAuth refresh token
    description: >-
      Refresh token minted with scope https://www.googleapis.com/auth/drive.file
      only. Password field. Never logged. Not required when a service account JSON is set.
  voice_trust_url:
    name: CallCatch Voice address (allow / block lists)
    description: >-
      Internal address of the CallCatch Voice App, for example
      http://<repohash>-twilio-house-voice:8787. Only http://hostname:port on the
      Supervisor network is accepted. Leave blank to hide list editing.
  voice_trust_token:
    name: CallCatch Voice trust token
    description: >-
      The same secret as trust_api_token in CallCatch Voice. Password field. Never logged.
  contacts_sync_enabled:
    name: Sync iPhone contacts (iCloud)
    description: >-
      Off by default. When on, CallCatch reads ALL iCloud contacts over CardDAV
      and writes number-to-name pairs to /share/callcatch/private/caller_names.json so
      missed-call and voicemail alerts show the contact's name. iCloud names
      override hand-kept entries; hand-kept numbers not in iCloud are kept
      (they live in caller_names.manual.json). Only counts are logged.
  icloud_apple_id:
    name: Apple ID email
    description: The Apple ID that owns the contacts. Never logged.
  icloud_app_password:
    name: iCloud app-specific password
    description: >-
      Create one at appleid.apple.com > Sign-In and Security > App-Specific
      Passwords. Do not use your Apple ID password. Password field. Never logged.
  contacts_sync_interval_min:
    name: Contacts sync interval (minutes)
    description: How often to re-read iCloud contacts. Default 30, minimum 15.
  contacts_drop_import:
    name: Import contacts from the share drop folder
    description: >-
      Off by default. When on, CallCatch reads .vcf files placed in
      /share/callcatch/import/, merges them into the private directory, and
      deletes the file on success. The usual import route is the admin
      Upload .vcf button, which stays available either way. Only counts are
      logged.
  agent_token:
    name: Phone agent token (CallCatch Line)
    description: >-
      Bearer secret CallCatch Line uses on the add-on network for the phone
      agent routes. At least 32 characters and different from the ingest
      token, or the routes stay off. Password field. Never logged.
  agent_inactivity_s:
    name: Finalize after quiet seconds
    description: >-
      A phone-agent call with no activity for this long is finalized and
      Bryson is notified with whatever was captured, marked as an early
      hangup. Default 180.
  hook_expected:
    name: Wait for a call-ended webhook
    description: >-
      On when a call-ended webhook is wired to CallCatch Line. A finished call
      then waits up to the grace period for it, so the full transcript rides
      along in the one email.
  hook_grace_s:
    name: Webhook grace (seconds)
    description: How long to wait for the call-ended webhook before sending anyway. Default 120.
  freebusy_calendars:
    name: Busy-time calendars
    description: >-
      Comma-separated calendar entities. Only start and end times are read.
      Titles, places and notes never leave CallCatch.
  freebusy_window:
    name: Busy-time window
    description: Weekday hours reported to the phone agent, America/New_York. Default 08:00-18:00.
  mail_backend:
    name: Email route
    description: >-
      off, or agentmail (direct HTTPS to the AgentMail API, no agent or
      routine in between).  Gmail is never used.
  mail_to:
    name: Email to
    description: >-
      One address on proton.me or protonmail.com (pinned in code).  Anything
      else, a list, or Gmail turns email off.
  agentmail_inbox:
    name: AgentMail sending inbox
    description: >-
      A dedicated CallCatch-only AgentMail inbox (callcatch…@agentmail.to) that
      the API key can send from.  Its scope is CallCatch only: never a shared
      bot inbox.  Use an inbox-scoped, send-only key, and keep the inbox out of
      reach of other agents' AgentMail connectors (see Documentation).
  agentmail_api_key:
    name: AgentMail API key
    description: Password field.  Never logged.
  email_full_number:
    name: Full callback number in email
    description: >-
      Off (default) shows the last 4 digits only.  On puts the full callback
      number in the email so it can be dialed.  The email leaves the house
      through the mail route, so turn this on only by explicit choice.
  gdit_work_copy:
    name: GDIT work-hours copy
    description: >-
      Off (default).  When on, a redacted copy of the Proton notice is sent
      to the pinned GDIT address only after the Proton notice, and only when
      binary_sensor.bryson_at_work is explicitly on.  VA, medical, and
      financial callers are skipped.  Still honors the notify dry-run switch.
  panel_base_url:
    name: Panel link base URL
    description: >-
      Optional.  Your Home Assistant address on the home network, for example
      http://homeassistant.local:8123.  When set, the email links to the
      CallCatch panel there.  Blank (default) leaves the link out and says to
      open CallCatch from the sidebar.
  push_service:
    name: iPhone push service
    description: >-
      Companion notify service, for example mobile_app_your_phone. The push
      shows the caller name and reference only. Blank turns the push off.
  late_update_push:
    name: Push when details arrive late
    description: >-
      One masked push if more details reach a call after its email went out.
      The email is never sent twice.
  timeout_notify_per_day:
    name: Hung-up-early notices per day
    description: >-
      Cap on email + push for calls finalized by the quiet-time finalizer,
      per day (ET).  Over the cap the call is still saved in CallCatch.
      Default 20.
  telnyx_api_key:
    name: Telnyx API key
    description: >-
      Used to list and delete call recordings. Password field. Never logged.
      Leave blank to keep the capture path off.
  telnyx_connection_ids:
    name: Telnyx connection allowlist
    description: >-
      Telnyx connection ids (digits, comma or space separated, up to 10) whose
      recordings CallCatch may read. Recordings from any other connection on the
      account are never downloaded, transcribed, emailed or deleted. Blank or
      invalid keeps capture off.
  telnyx_delete_remote:
    name: Delete Telnyx recording after save
    description: >-
      On (default) deletes Telnyx's copy only after the audio and the
      transcript are stored locally and re-read. A failure never deletes it.
  telnyx_poll_s:
    name: Telnyx recording poll (seconds)
    description: >-
      How often to list recordings in case a webhook was missed or CallCatch
      restarted mid-call. Default 30. Minimum 15.
  xai_api_key:
    name: xAI speech-to-text key
    description: >-
      Sent only to the xAI speech-to-text endpoint. Password field. Never logged.
      Read from this option, or from the XAI_API_KEY environment variable when
      the option is blank.
  xai_stt_model:
    name: Speech-to-text model
    description: Model name for the xAI speech-to-text request. Default grok-voice-transcribe-2.0.
  recording_grace_s:
    name: Wait for the recording (seconds)
    description: >-
      When a Telnyx or xAI key is set, the one email waits this long for the
      verbatim transcript. Default 180. The call is still saved if it never arrives.
