name: design-tokens
on:
  pull_request:
    paths: ["shared/design/**", "**/static/bui/**"]
  push:
    branches: [main]
    paths: ["shared/design/**", "**/static/bui/**"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 shared/design/build.py --check
      - run: python3 shared/design/sync.py --check
