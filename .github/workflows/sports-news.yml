name: sports-news
on:
  pull_request:
    paths: ["sports_news/**", ".github/workflows/sports-news.yml"]
  push:
    branches: [main]
    paths: ["sports_news/**", ".github/workflows/sports-news.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - run: python3 sports_news/rootfs/app/selfcheck.py
      - run: python3 sports_news/tests/test_sports_news.py
