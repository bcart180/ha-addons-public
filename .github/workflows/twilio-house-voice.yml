name: twilio_house_voice

on:
  push:
    paths:
      - "twilio_house_voice/**"
      - ".github/workflows/twilio-house-voice.yml"
  pull_request:
    paths:
      - "twilio_house_voice/**"
      - ".github/workflows/twilio-house-voice.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install runtime
        run: python -m pip install aiohttp==3.14.5 ruff==0.17.3
      - name: Lint
        run: ruff check twilio_house_voice --config twilio_house_voice/ruff.toml
      - name: Compile
        run: python -m compileall -q twilio_house_voice/rootfs/app twilio_house_voice/tests
      - name: Test
        run: python twilio_house_voice/tests/test_voice.py
      - name: Early-hangup delivery tests
        run: python twilio_house_voice/tests/test_hangup.py
      - name: HA readiness + attempt cap tests
        run: python twilio_house_voice/tests/test_ready.py
