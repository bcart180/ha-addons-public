name: Add-on CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  addon-lint:
    name: Lint voicemail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Confirm sidebar flag
        run: |
          grep -qx 'ingress_panel: true' voicemail/config.yaml
          grep -qx 'panel_admin: true' voicemail/config.yaml
      - name: Prepare voicemail lint input
        # frenck/action-addon-linter rejects ingress_panel; that key is not in its schema.
        # config.yaml keeps it. Lint the same config and build files with only that key removed.
        run: |
          set -euo pipefail
          mkdir -p .ci-lint/voicemail
          cp voicemail/config.yaml voicemail/build.yaml .ci-lint/voicemail/
          sed -i '/^ingress_panel: true$/d' .ci-lint/voicemail/config.yaml
          # panel_admin: true is the Supervisor default; the linter rejects an explicit default.
          sed -i '/^panel_admin: true$/d' .ci-lint/voicemail/config.yaml
          grep -qx 'ingress_panel: true' voicemail/config.yaml
          if grep -q '^ingress_panel:' .ci-lint/voicemail/config.yaml; then
            echo "lint copy still has ingress_panel" >&2
            exit 1
          fi
      - name: Home Assistant add-on lint
        uses: frenck/action-addon-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7 # v2.21.1
        with:
          path: ./.ci-lint/voicemail

  callcatch-tests:
    name: CallCatch tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install test dependencies
        run: python -m pip install aiohttp==3.14.5 pytest==9.2.0 pytest-asyncio==1.4.1.post1 pyyaml==6.0.3 jinja2==3.1.6
      - name: pytest
        run: pytest -q voicemail/tests
      - name: test_transcript_polish.js
        run: node voicemail/tests/test_transcript_polish.js

  callcatch-voice:
    name: CallCatch Voice lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install lint and test dependencies
        run: python -m pip install aiohttp==3.14.5 ruff==0.17.3
      - name: Ruff
        run: ruff check twilio_house_voice --config twilio_house_voice/ruff.toml
      - name: test_voice.py
        run: python twilio_house_voice/tests/test_voice.py
      - name: test_ready.py
        run: python twilio_house_voice/tests/test_ready.py

  trading-desk-tests:
    name: Trading Desk tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install aiohttp==3.14.5
      - name: read-only self-check
        run: python trading_desk/rootfs/app/selfcheck.py
      - name: test_readonly.py
        run: python trading_desk/tests/test_readonly.py
      - name: test_ui_trial.py
        run: python trading_desk/tests/test_ui_trial.py
      - name: test_schwab.py
        run: python trading_desk/tests/test_schwab.py
      - name: Schwab sign formatting
        run: node --test trading_desk/tests/test_assets_signs.mjs

  smart-hvac:
    name: Smart HVAC lint + tests
    # ubuntu-latest is moving to 26.04. Playwright's install-deps there apt-gets a
    # large WebKit stack and retries a failing mirror until the step is killed.
    # 24.04 already has those libraries, which is the ~1 minute main run.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: smart_hvac
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install aiohttp==3.14.5 pytest==9.2.0 pytest-aiohttp==1.1.1 pyyaml==6.0.3 ruff==0.17.3
      - name: ruff
        run: ruff check .
      - name: pytest
        run: pytest -q
      - name: Lovelace card tests (runner's preinstalled Node)
        run: node --version && node --test lovelace/tests/card.test.mjs
      - name: Climate scroll place (WebKit and Chromium)
        timeout-minutes: 8
        run: |
          # The spec requires @playwright/test. NODE_PATH points it at this
          # prefix so the runner and the spec load the same 1.65.0 install.
          # Browsers come from that install. Do not apt-install deps here:
          # on Ubuntu 26 that download retries a dead mirror with no bound.
          set -euo pipefail
          npm install --no-fund --no-audit --no-save --prefix /tmp/smart-hvac-pw @playwright/test@1.65.0
          PW=/tmp/smart-hvac-pw/node_modules/.bin/playwright
          "$PW" install webkit chromium
          NODE_PATH=/tmp/smart-hvac-pw/node_modules "$PW" test tests/ui
      - name: Safe defaults (master off, dry run)
        run: |
          grep -qx '  enabled: false' config.yaml
          grep -qx '  dry_run: true' config.yaml
      - name: Prepare add-on lint input (linter rejects ingress_panel)
        run: |
          mkdir -p ../.ci-lint/smart_hvac
          cp config.yaml build.yaml ../.ci-lint/smart_hvac/
          sed -i '/^ingress_panel: true$/d' ../.ci-lint/smart_hvac/config.yaml
      - name: Home Assistant add-on lint
        uses: frenck/action-addon-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7 # v2.21.1
        with:
          path: ./.ci-lint/smart_hvac

  tesla-smart-charge:
    name: Tesla Smart Charge lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tesla_smart_charge
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pyyaml ruff
      - name: ruff
        run: ruff check .
      - name: pytest
        run: pytest -q
      - name: Lovelace card tests (runner's preinstalled Node)
        run: node --version && node --test lovelace/tests/card.test.mjs
      - name: Safe default (dry run)
        run: "grep -qx '  dry_run: true' config.yaml"
      - name: Home Assistant add-on lint
        uses: frenck/action-addon-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7 # v2.21.1
        with:
          path: ./tesla_smart_charge

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          # The public releases CDN is returning HTTP 504. gh downloads the same
          # official asset through the GitHub API. The checksum below is unchanged.
          gh release download "v${version}" --repo gitleaks/gitleaks --pattern "$archive" --dir /tmp
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/${archive}" | sha256sum -c -
          tar -xzf "/tmp/${archive}" -C /usr/local/bin gitleaks
          gitleaks version
      - name: Secret scan
        run: gitleaks detect --source . --redact --verbose --no-banner
