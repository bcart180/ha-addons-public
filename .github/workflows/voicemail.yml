name: voicemail

on:
  push:
    paths:
      - "voicemail/**"
      - ".github/workflows/voicemail.yml"
  pull_request:
    paths:
      - "voicemail/**"
      - ".github/workflows/voicemail.yml"

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install aiohttp==3.14.5 pytest==9.2.0 pytest-asyncio==1.4.1 pyyaml==6.0.3 jinja2==3.1.6 ruff==0.17.3
      - name: Lint
        run: ruff check voicemail --config voicemail/ruff.toml
      - name: Test
        run: |
          python -m pytest voicemail/tests -q
          node voicemail/tests/test_transcript_polish.js
          python voicemail/tests/test_normalize.py
      - name: Install gitleaks
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl -fsSL -o "/tmp/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/${archive}" | sha256sum -c -
          tar -xzf "/tmp/${archive}" -C /usr/local/bin gitleaks
          gitleaks version
      - name: gitleaks
        run: gitleaks detect --source . --redact --no-banner --exit-code 1
