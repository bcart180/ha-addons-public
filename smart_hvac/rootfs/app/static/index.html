<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Climate</title>
<style>
:root{
  --bg:#000000;--band:#1a1a1a;--card:#414141;--selected:#757575;--blue:#005aff;--green:#3ddc5a;
  --line:#5c5c5c;--fg:#ffffff;--mut:#d0d0d0;--dim:#b4b6bb;
  /* Words stay the meaning. Blue is the active mark. Green is only the current temperature. */
  --heat:#d0d0d0;--cool:var(--blue);--hold:#f2f2f2;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:#2f2f2f;border:1px solid var(--line);border-radius:8px;min-height:48px;padding:0 16px;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
button.on{background:var(--selected);border-color:var(--selected);color:#ffffff}
button.heat.on,button.cool.on{background:var(--selected);color:#ffffff;border-color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding:16px 16px 48px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 16px;padding-bottom:14px;border-bottom:1px solid #3a3a3a;position:sticky;top:0;background:var(--bg);z-index:2}
h1{font-size:24px;line-height:29px;font-weight:500;letter-spacing:0;margin:0}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{font-size:16px;letter-spacing:.02em;border:1px solid var(--line);border-radius:999px;padding:6px 12px;color:var(--mut);background:var(--band)}
.pill.auto,.pill.manual,.pill.hold{color:var(--fg);border-color:#6a6a6a}
.sub{flex:1 1 100%;color:var(--mut);font-size:16px;min-height:1.2em}
.banner{margin:14px 0;padding:12px 14px;border:1px solid #3a3a3a;border-radius:8px;background:var(--band);color:var(--mut);font-size:16px}
.banner strong{color:var(--fg);font-weight:500}
.sched{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.card.rm0,.card.rm1,.card.rm2{box-shadow:none}
.zh{display:flex;justify-content:space-between;gap:8px 12px;align-items:baseline;flex-wrap:wrap}
.zh h2{margin:0;font-size:24px;line-height:29px;font-weight:500}
.zh span{color:var(--mut);font-size:16px}
.st.heat,.st.cool,.st.defrost{color:var(--fg)}
.rowlabel.holdlab{color:var(--hold)}
.now{display:flex;align-items:baseline;gap:12px;font-size:56px;font-weight:400;letter-spacing:0;line-height:64px;margin:8px 0 4px;font-variant-numeric:tabular-nums;color:var(--green)}
.now small{font-size:32px;font-weight:400;color:var(--green)}
.hum{font-size:16px;line-height:1.4;color:var(--mut);font-weight:400}
.target{font-size:16px;margin:0 0 4px}
.why{color:var(--mut);font-size:16px;min-height:1.3em;margin:0 0 8px}
/* slope-pause-start */
.slope-pause{color:#3e6ae1}
/* slope-pause-end */
.zone-graph{min-width:0;margin:0 0 8px}
.zone-graph svg{height:160px}
.rowlabel{font-size:16px;letter-spacing:.04em;text-transform:uppercase;color:var(--dim);margin:14px 0 6px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:56px;height:56px;border-radius:8px;font-size:26px;padding:0}
.stepper b{font-size:28px;font-weight:400;min-width:72px;text-align:center;font-variant-numeric:tabular-nums}
.hint{color:var(--dim);font-size:16px;margin:6px 0 0}
.durs{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.durs button{min-width:64px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.actions button{flex:1 1 160px}
button.go{background:#2a2a2a}
button.go.on,button.on.go{background:var(--selected)}
.count{color:var(--hold);font-size:16px;font-variant-numeric:tabular-nums}
.modes{display:flex;flex-wrap:wrap;gap:8px}
.modes button{flex:1 1 180px}
.graphhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.graphhead h2{font-size:24px;line-height:29px}
svg.g{width:100%;height:200px;display:block;margin-top:8px}
.leg{display:flex;flex-wrap:wrap;gap:12px;color:var(--mut);font-size:16px;margin-top:8px}
.leg i{display:inline-block;width:14px;height:3px;margin-right:6px;vertical-align:middle}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.metric{border:1px solid #6a6a6a;border-radius:8px;padding:10px 12px;background:#2f2f2f}
.metric b{display:block;font-size:24px;font-weight:400;font-variant-numeric:tabular-nums;color:var(--fg)}
.metric.heat b,.metric.cool b{color:var(--fg)}
.metric span{color:var(--mut);font-size:16px}
details{margin-top:8px;color:var(--mut);font-size:16px}
details summary{min-height:48px;display:flex;align-items:center;cursor:pointer}
.prefrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid #6a6a6a;font-size:16px}
.synth{border-color:#6a6a6a;color:var(--fg)}
@media (min-width:932px){
  .grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .wide{grid-column:1 / -1}
  .metrics{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Climate</h1>
  <div class="pills" id="pills"></div>
  <div class="sub" id="sub"></div>
</header>
<div id="banner"></div>
<div class="sched" id="sched"></div>
<div class="grid" id="zones"></div>
</div>
<script>
const MOCK = new URLSearchParams(location.search).has("mock");
const REASONS = {ok:"Schedule target",no_change:"At the schedule target",manual_override:"Temporary hold",
  defrosting:"Defrosting — the schedule waits",preheating:"Pre-heating — the schedule waits",
  short_cycle_guard:"Waiting out the compressor minimum cycle",
  vacation_setback:"Vacation setback",vacation_at_setback:"Vacation setback",vacation_radiant_off:"Vacation — radiant stays off",
  unit_off:"Off at the unit",window_open:"Window open",window_slope_pause:"Paused, window open?",missing_indoor_temp:"Indoor temperature missing",
  "missing:indoor_temp":"Indoor temperature missing","missing:outdoor_temp":"Outdoor temperature missing",
  "missing:presence":"Presence unknown — holding the last target",mode_lock:"Matched to the other mini split"};
const HOURS = [[0.5,"30m"],[1,"1h"],[2,"2h"],[4,"4h"]];
let S = null, hours = 2, msg = "", hist = {by:{}}, histErr = {};
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => "&#" + c.charCodeAt(0) + ";");
const $ = (id) => document.getElementById(id);

async function api(path, body) {
  if (MOCK) return mockApi(path, body);
  const r = await fetch(path, body ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)} : {});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || String(r.status));
  return j;
}

function zoneResult(name){ return ((S && S.last && S.last.zones) || {})[name] || {}; }
function prefs(z){ return (z.preferences || (S.preferences || {})[z.name] || {}); }
function resolvedKey(z){
  const p = zoneResult(z.name).profile;
  const mode = (zoneResult(z.name).live || {}).mode;
  if (p === "sleep") return "sleep";
  if (p === "away" || p === "vacation") return mode === "cool" ? "away_cool" : "away_heat";
  return "home";
}
function prefLabel(key){ return {home:"Home",sleep:"Sleep",away_heat:"Away heat",away_cool:"Away cool"}[key] || key; }
function sourceLabel(src){
  return {zone:"saved for this room",zone_option:"set in the configuration",saved_schedule:"saved schedule",schedule:"schedule default"}[src] || "schedule";
}
function fmtClock(ts){
  if (ts == null) return "";
  const s = new Date(ts * 1000).toLocaleTimeString("en-US", {hour:"numeric", minute:"2-digit", timeZone:"America/New_York"});
  return s + " ET";
}
function fmtF(n){
  if (n == null || Number.isNaN(Number(n))) return null;
  const v = Math.round(Number(n) * 2) / 2;
  return Math.abs(v - Math.round(v)) < 0.01 ? String(Math.round(v)) : v.toFixed(1);
}
function rememberedTemp(z){
  const o = z && z.override_temps;
  if (!o || o.source !== "zone" || o.temperature == null) return null;
  return Number(o.temperature);
}
function tempHi(z){ return z && z.heat_only ? Number(S.radiant_setpoint_max || 85) : 84; }
function fmtDur(sec){
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
  if (h <= 0) return m + "m";
  return h + "h " + String(m).padStart(2, "0") + "m";
}
function holdLeft(z){
  if (!z.override_until) return 0;
  return z.override_until - Date.now() / 1000;
}
function ro(){ return !S || !S.enabled || S.dry_run; }

function banner(){
  const bits = [];
  if (MOCK) bits.push('<div class="banner synth"><strong>Synthetic example.</strong> Not a live house. Nothing is sent to a thermostat.</div>');
  if (!S) return bits.join("");
  if (!S.enabled) bits.push('<div class="banner">The app is off. This screen only shows state. Opening it changes nothing.</div>');
  else if (S.dry_run) bits.push('<div class="banner">Practice mode. Schedule preferences can be saved. Device changes stay off.</div>');
  const home = S.last && S.last.presence_home;
  const anyAway = (S.zones || []).some((z) => zoneResult(z.name).profile === "away");
  if (home === true && anyAway) bits.push('<div class="banner">Presence is home. At least one room’s schedule result is Away. Opening this screen does not clear that or any hold.</div>');
  if (msg) bits.push('<div class="banner">' + esc(msg) + "</div>");
  return bits.join("");
}

function pills(){
  if (!S) return "";
  const profile = S.profile || "auto";
  const held = (S.zones || []).filter((z) => holdLeft(z) > 0);
  const out = [];
  if (profile === "auto") out.push('<span class="pill auto">Full Auto</span>');
  else out.push('<span class="pill manual">Manual profile · ' + esc(profile) + "</span>");
  const resolved = [...new Set((S.zones || []).map((z) => zoneResult(z.name).profile).filter(Boolean))];
  if (resolved.length) out.push('<span class="pill">Resolved ' + esc(resolved.join(" · ")) + "</span>");
  if (held.length) out.push('<span class="pill hold">' + held.length + " hold" + (held.length > 1 ? "s" : "") + "</span>");
  const pres = S.last && S.last.presence_home;
  if (pres === true) out.push('<span class="pill">Presence home</span>');
  else if (pres === false) out.push('<span class="pill">Presence away</span>');
  else out.push('<span class="pill">Presence unknown</span>');
  return out.join("");
}

function subline(){
  if (!S || !S.last) return "Loading…";
  const ts = S.last.ts;
  const age = ts ? Math.max(0, Math.round(Date.now() / 1000 - ts)) : null;
  const fresh = age == null ? "No cycle yet" : age < 90 ? "Cycle just ran" : "Last cycle " + fmtDur(age) + " ago";
  const out = S.last.outdoor != null ? "Outside " + Math.round(S.last.outdoor) + "°" : "Outside unavailable";
  return fresh + " · " + out + " · Fan Auto is a fan speed, not Full Auto.";
}

function schedButtons(){
  const cur = S && S.profile;
  const btn = (id, label) => '<button data-profile="' + id + '"' + (cur === id ? ' class="on"' : "") + ">" + label + "</button>";
  let html = btn("auto", "Full Auto") + btn("home", "Home") + btn("sleep", "Sleep") + btn("away", "Away");
  if ((S.zones || []).some((z) => holdLeft(z) > 0)) html += '<button data-resume-all="1">Resume automatic · both</button>';
  return html;
}

function zoneCard(z){
  const r = zoneResult(z.name), live = r.live || {}, key = resolvedKey(z), pref = prefs(z)[key] || {};
  const indoor = live.indoor, held = holdLeft(z) > 0;
  const target = held ? live.setpoint : (r.setpoint != null ? r.setpoint : pref.temperature);
  const why = REASONS[r.reason] || (r.reason ? String(r.reason) : "Waiting for a cycle");
  const whyHtml = r.reason === "window_slope_pause" ? '<span class="slope-pause">' + esc(why) + "</span>" : esc(why);
  const next = r.next && r.next.setpoint != null ? "Next schedule " + r.next.setpoint + "° " + (r.next.profile || "") + " at " + fmtClock(r.next.ts) : "";
  const dfr = r.defrosting || r.defrost;
  const status = dfr ? (r.defrost === "preheating" ? "Pre-heating" : "Defrosting") : (live.hvac_action || live.mode || "—");
  const act = String(live.hvac_action || "");
  const tone = dfr ? "defrost" : act === "heating" ? "heat" : act === "cooling" ? "cool" : "";
  let slot = 0;
  for (let i = 0; i < z.name.length; i++) slot = (slot + z.name.charCodeAt(i)) % 3;
  const pt = pref.temperature != null ? pref.temperature : target;
  const savedOv = rememberedTemp(z);
  const draft = savedOv != null ? savedOv : (held && live.setpoint != null ? live.setpoint : (pt != null ? pt : 70));
  const autoF = r.setpoint != null ? r.setpoint : (pref.temperature != null ? pref.temperature : null);
  const holdF = savedOv != null ? savedOv : (live.setpoint != null ? live.setpoint : autoF);
  const line = held
    ? "Manual override " + (fmtF(holdF) || "—") + "°F until " + fmtClock(z.override_until)
    : "Auto " + (fmtF(autoF) != null ? fmtF(autoF) + "°F" : "—");
  let html = '<article class="card rm' + slot + (held ? " held" : "") + '" data-zone="' + esc(z.name) + '"><div class="zh"><h2>' + esc(z.label) + '</h2><span class="st ' + tone + '">' +
    (z.heat_only ? "Radiant" : "Mini split") + " · " + esc(status) + "</span></div>";
  const hum = live.humidity != null ? '<span class="hum">' + Math.round(live.humidity) + "%</span>" : "";
  html += '<div class="now">' + (indoor != null ? Math.round(indoor) : "—") + "<small>°</small>" + hum + "</div>";
  html += '<p class="target">' + esc(line) + "</p>";
  html += '<p class="why">' + whyHtml + (next ? " · " + esc(next) : "") + "</p>";
  const tileGraph = hist.by && hist.by[z.name];
  html += '<div class="zone-graph">' + (histErr[z.name] ? '<p class="hint">History unavailable. Nothing is filled in.</p>' : graphSvg(tileGraph, 160)) + "</div>";
  html += '<div class="rowlabel">Schedule preference · ' + esc(prefLabel(key)) + "</div>";
  html += '<div class="stepper"><button data-pref="-0.5" data-key="' + key + '" aria-label="Lower preference">−</button><b>' +
    (pt != null ? pt : "—") + '°</b><button data-pref="0.5" data-key="' + key + '" aria-label="Raise preference">+</button></div>';
  html += '<p class="hint">Saves the ' + esc(prefLabel(key)) + " temperature for this room. Does not start a hold.</p>";
  html += '<div class="rowlabel holdlab">Temporary hold</div>';
  if (held) {
    html += '<p class="count">' + fmtDur(holdLeft(z)) + " left</p>";
    html += '<div class="actions"><button data-resume="1">Resume automatic</button></div>';
  }
  html += '<div class="stepper"><button data-hold="-0.5" aria-label="Lower override temperature">−</button><b data-draft="' + draft + '">' +
    fmtF(draft) + '°</b><button data-hold="0.5" aria-label="Raise override temperature">+</button></div>';
  html += '<p class="hint">Saves this override temperature. Does not start a hold. Heat and cool follow the temperature.</p>';
  html += '<div class="durs">' + HOURS.map(([h, l]) => '<button data-hours="' + h + '"' + (hours === h ? ' class="on"' : "") + ">" + l + "</button>").join("") + "</div>";
  html += '<div class="actions"><button class="go" data-override="1"' + (ro() ? " disabled" : "") + ">Hold " + fmtF(draft) + "° for " +
    (HOURS.find((x) => x[0] === hours) || HOURS[2])[1] + "</button></div>";
  html += '<p class="hint">A hold keeps this temperature until the timer ends or you resume. It is not the schedule.</p>';
  html += "<details><summary>Other schedule temperatures</summary>";
  for (const k of ["home", "sleep", "away_heat", "away_cool"]) {
    const row = prefs(z)[k] || {};
    if (row.temperature == null) continue;
    html += '<div class="prefrow"><span>' + esc(prefLabel(k)) + " · " + esc(sourceLabel(row.source)) + "</span><span>" + row.temperature + "°</span></div>";
  }
  html += "</details></article>";
  return html;
}

function sharedMode(){
  const splits = (S.zones || []).filter((z) => !z.heat_only);
  if (!splits.length) return "";
  const modes = splits.map((z) => (zoneResult(z.name).live || {}).mode);
  const same = modes.every((m) => m === modes[0]) ? modes[0] : "mixed";
  return '<article class="card wide"><div class="zh"><h2>Both mini splits</h2><span>' + (same === "mixed" ? "Modes differ" : esc(same || "—")) + "</span></div>" +
    '<p class="hint">Heat and cool are chosen automatically from the temperature. Off turns both mini splits off.</p>' +
    '<div class="modes"><button' + (same === "off" ? ' class="on"' : "") + ' data-mode="off"' + (ro() ? " disabled" : "") + ">Off · both</button></div></article>";
}

function seriesMinutes(pts, end){
  if (!pts || !pts.length) return null;
  let min = 0;
  for (let i = 0; i < pts.length; i++) {
    if (!pts[i][1]) continue;
    const t2 = (pts[i + 1] || [end])[0];
    min += Math.max(0, t2 - pts[i][0]) / 60;
  }
  return Math.round(min);
}
function gaps(pts){
  if (!pts || pts.length < 2) return false;
  for (let i = 1; i < pts.length; i++) if (pts[i][0] - pts[i - 1][0] > 45 * 60) return true;
  return false;
}
function graphSvg(d, plotH){
  if (!d) return "";
  const w = 640, h = plotH || 200, pad = {l:8, r:44, t:20, b:12};
  const W = w - pad.l - pad.r, H = h - pad.t - pad.b;
  const vals = [...(d.indoor || []), ...(d.setpoint || []), ...(d.outdoor || [])].map((p) => p[1]).filter((v) => v != null);
  if (!vals.length) return '<p class="hint">No temperature history in this range.</p>';
  let lo = Math.floor(Math.min(...vals) - 2), hi = Math.ceil(Math.max(...vals) + 2);
  const X = (t) => pad.l + ((t - d.start) / Math.max(1, d.end - d.start)) * W;
  const Y = (v) => pad.t + (1 - (v - lo) / Math.max(1, hi - lo)) * H;
  const line = (pts) => {
    let s = "", prev = null;
    for (const [t, v] of pts || []) {
      if (v == null) { prev = null; continue; }
      s += (prev == null ? "M" : "L") + X(t).toFixed(1) + "," + Y(v).toFixed(1);
      prev = v;
    }
    return s;
  };
  let bands = "";
  (d.heating || []).forEach(([t, on], i) => { if (!on) return; const t2 = (d.heating[i + 1] || [d.end])[0];
    bands += '<rect x="' + X(t).toFixed(1) + '" y="' + pad.t + '" width="' + Math.max(1, X(t2) - X(t)).toFixed(1) + '" height="' + H + '" fill="rgba(117,117,117,.45)"/>'; });
  (d.cooling || []).forEach(([t, on], i) => { if (!on) return; const t2 = (d.cooling[i + 1] || [d.end])[0];
    bands += '<rect x="' + X(t).toFixed(1) + '" y="' + pad.t + '" width="' + Math.max(1, X(t2) - X(t)).toFixed(1) + '" height="' + H + '" fill="rgba(0,90,255,.22)"/>'; });
  (d.defrost || []).forEach(([t, on], i) => { if (!on) return; const t2 = (d.defrost[i + 1] || [d.end])[0];
    bands += '<rect x="' + X(t).toFixed(1) + '" y="' + pad.t + '" width="' + Math.max(2, X(t2) - X(t)).toFixed(1) + '" height="' + H + '" fill="rgba(117,117,117,.28)"/><text x="' + (X(t) + 4).toFixed(1) + '" y="' + (pad.t + 16) + '" fill="#d0d0d0" font-size="16">Defrosting</text>'; });
  let grid = "";
  for (const v of [lo, Math.round((lo + hi) / 2), hi]) grid += '<line x1="' + pad.l + '" x2="' + (w - pad.r) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="#6a6a6a"/><text x="' + (w - 2) + '" y="' + (Y(v) + 4) + '" fill="#b4b6bb" font-size="16" text-anchor="end">' + v + "°</text>";
  return '<svg class="g" viewBox="0 0 ' + w + " " + h + '" role="img">' + grid + bands +
    '<path d="' + line(d.outdoor) + '" fill="none" stroke="#757575" stroke-dasharray="4 3" stroke-width="1.2"/>' +
    '<path d="' + line(d.setpoint) + '" fill="none" stroke="#005aff" stroke-width="1.6"/>' +
    '<path d="' + line(d.indoor) + '" fill="none" stroke="#3ddc5a" stroke-width="1.8"/></svg>';
}

function graphCard(){
  const zones = S.zones || [];
  const names = zones.map((z) => '<button data-graph="' + esc(z.name) + '"' + ((hist.zone || zones[0].name) === z.name ? ' class="on"' : "") + ">" + esc(z.label) + "</button>").join("");
  const rng = hist.range || "24h";
  const d = hist.data, name = hist.zone || (zones[0] && zones[0].name);
  let body = histErr[name] ? '<p class="hint">History unavailable. Nothing is filled in.</p>' : graphSvg(d);
  const gap = d && gaps(d.indoor);
  const metrics = [];
  const add = (b, s, tone) => { if (b == null) return; metrics.push("<div class='metric" + (tone ? " " + tone : "") + "'><b>" + b + "</b><span>" + s + "</span></div>"); };
  if (d) {
    add(seriesMinutes(d.heating, d.end), "min heating in view", "heat");
    add(seriesMinutes(d.cooling, d.end), "min cooling in view", "cool");
    add(seriesMinutes(d.defrost, d.end), "min defrost in view", "cool");
    const hum = (d.humidity || []).filter((p) => p[1] != null).pop();
    if (hum) add(Math.round(hum[1]) + "%", "humidity, last point");
  }
  const z = zones.find((x) => x.name === name);
  const liveH = z && (zoneResult(z.name).live || {}).humidity;
  if (liveH != null) add(Math.round(liveH) + "%", "humidity now");
  return '<article class="card wide"><div class="graphhead"><h2 style="margin:0">History</h2><div class="durs"><button data-range="24h"' +
    (rng === "24h" ? ' class="on"' : "") + '>24h</button><button data-range="7d"' + (rng === "7d" ? ' class="on"' : "") + ">7d</button></div></div>" +
    '<div class="durs">' + names + "</div>" + body +
    (gap ? '<p class="hint">Gap in the recorded history. Missing time is not drawn as a real temperature.</p>' : "") +
    '<div class="leg"><span><i style="background:#3ddc5a"></i>Indoor</span><span><i style="background:#005aff"></i>Target</span><span><i style="background:#757575"></i>Outdoor</span><span><i style="background:#757575;height:8px"></i>Heating</span><span><i style="background:#005aff;height:8px"></i>Cooling / defrost</span></div>' +
    '<div class="metrics">' + metrics.join("") + "</div>" +
    '<p class="hint">Times above are measured from the history that was returned. No energy, cost, or efficiency number is estimated.</p></article>';
}

function render(){
  // Keep the tapped control at the same screen position. If that control is gone
  // (Resume, hold ended), keep its room card. A refresh with no tap keeps scrollY.
  function placed(p) {
    if (!p || !Object.keys(p.attrs).length) return null;
    const keys = Object.keys(p.attrs);
    const buttons = document.querySelectorAll("button");
    for (let i = 0; i < buttons.length; i++) {
      const el = buttons[i];
      const names = el.getAttributeNames().filter((n) => n.startsWith("data-"));
      if (names.length !== keys.length || names.some((n) => p.attrs[n] !== el.getAttribute(n))) continue;
      const host = el.closest("[data-zone]");
      if ((host ? host.getAttribute("data-zone") : null) === p.zone) return el;
    }
    return null;
  }
  function zoneEl(zone) {
    if (!zone) return null;
    const cards = document.querySelectorAll("[data-zone]");
    for (let i = 0; i < cards.length; i++) if (cards[i].getAttribute("data-zone") === zone) return cards[i];
    return null;
  }
  const savedY = window.scrollY || window.pageYOffset || 0;
  let mark = null;
  if (anchor) {
    const el = placed(anchor);
    if (el) {
      const card = zoneEl(anchor.zone);
      mark = { place: anchor, top: el.getBoundingClientRect().top, cardTop: card ? card.getBoundingClientRect().top : null };
    }
    anchor = null;
  }
  $("pills").innerHTML = pills();
  $("sub").textContent = subline();
  $("banner").innerHTML = banner();
  $("sched").innerHTML = S ? schedButtons() : "";
  $("zones").innerHTML = S ? ((S.zones || []).map(zoneCard).join("") + sharedMode() + graphCard()) : "";
  const nudge = (el, top) => {
    if (!el || top == null) return false;
    const dy = el.getBoundingClientRect().top - top;
    if (dy) window.scrollBy(0, dy);
    return true;
  };
  let held = false;
  if (mark) held = nudge(placed(mark.place), mark.top);
  if (mark && !held) held = nudge(zoneEl(mark.place.zone), mark.cardTop);
  if (!held) {
    const now = window.scrollY || window.pageYOffset || 0;
    if (now !== savedY) window.scrollBy(0, savedY - now);
  }
}

async function fetchHist(name){
  try {
    hist.by[name] = await api("api/zone/" + name + "/history?range=" + (hist.range || "24h"));
    histErr[name] = false;
  } catch (e) { hist.by[name] = null; histErr[name] = true; }
}
async function loadHist(name, range){
  const next = range || hist.range || "24h";
  const changed = next !== hist.range;
  hist.zone = name;
  hist.range = next;
  const names = (changed || !hist.by[name]) ? (S.zones || []).map((z) => z.name) : [name];
  await Promise.all(names.map((zone) => fetchHist(zone)));
  hist.data = hist.by[name] || null;
  render();
}

async function boot(){
  try { S = await api("api/state"); msg = ""; }
  catch (e) { msg = "Can't reach Smart HVAC"; render(); return; }
  render();
  if (S.zones && S.zones[0]) loadHist(S.zones[0].name, "24h");
}
let anchor = null;
document.body.addEventListener("click", async (ev) => {
  const b = ev.target.closest("button");
  if (!b || !S) return;
  const attrs = {};
  for (const name of b.getAttributeNames()) if (name.startsWith("data-")) attrs[name] = b.getAttribute(name);
  const host = b.closest("[data-zone]");
  anchor = { attrs, zone: host ? host.getAttribute("data-zone") : null };
  try {
    if (b.dataset.profile) { S = await api("api/profile", {profile:b.dataset.profile}); msg = ""; }
    else if (b.dataset.resumeAll) { S = await api("api/resume-all", {}); msg = ""; }
    else if (b.dataset.hours) { hours = Number(b.dataset.hours); render(); return; }
    else if (b.dataset.mode) {
      msg = "";
      for (const z of S.zones.filter((x) => !x.heat_only)) S = await api("api/zone/" + z.name + "/mode", {hvac_mode:b.dataset.mode, hours});
    } else if (b.dataset.range || b.dataset.graph) {
      const name = b.dataset.graph || hist.zone;
      await loadHist(name, b.dataset.range || hist.range); return;
    } else {
      const card = b.closest("[data-zone]");
      if (!card) { render(); return; }
      const name = card.dataset.zone;
      if (b.dataset.pref) {
        const key = b.dataset.key;
        const cur = (prefs(S.zones.find((z) => z.name === name))[key] || {}).temperature;
        const t = Math.round(((cur || 70) + Number(b.dataset.pref)) * 2) / 2;
        S = await api("api/zone/" + name + "/preference", {profile:key, temperature:t});
        msg = "Saved the schedule preference. No hold was started.";
      } else if (b.dataset.hold) {
        const el = card.querySelector("[data-draft]");
        const zone = S.zones.find((x) => x.name === name);
        const t = Math.min(tempHi(zone), Math.max(55, Math.round((Number(el.dataset.draft) + Number(b.dataset.hold)) * 2) / 2));
        S = await api("api/zone/" + name + "/override-temp", {temperature:t});
        msg = "Saved the override temperature. No hold was started.";
      } else if (b.dataset.override) {
        const t = Number(card.querySelector("[data-draft]").dataset.draft);
        S = await api("api/zone/" + name + "/override", {temperature:t, hours});
        msg = "";
      } else if (b.dataset.resume) { S = await api("api/zone/" + name + "/resume", {}); msg = ""; }
    }
  } catch (e) { msg = e.message; }
  render();
});

function mockApi(path, body){
  const now = Math.floor(Date.now() / 1000);
  if (!S) S = mockState(now);
  if (path.includes("/history")) {
    const name = path.split("/")[2];
    const span = path.endsWith("7d") ? 7 * 86400 : 86400;
    const start = now - span, n = 48, indoor = [], setpoint = [], outdoor = [], heating = [], cooling = [], defrost = [], humidity = [];
    for (let i = 0; i <= n; i++) {
      const t = start + i * span / n;
      const wave = Math.sin(i / 5) * 1.2;
      indoor.push([t, +(68 + wave).toFixed(1)]);
      setpoint.push([t, 70]);
      outdoor.push([t, +(36 + Math.sin(i / 8) * 4).toFixed(1)]);
      heating.push([t, i % 7 < 3 ? 1 : 0]);
      cooling.push([t, 0]);
      defrost.push([t, i === 20 || i === 21 ? 1 : 0]);
      humidity.push([t, 42]);
    }
    if (n > 10) indoor.splice(12, 8);
    return {zone:name, range: path.endsWith("7d") ? "7d" : "24h", start, end:now, indoor, setpoint, outdoor, heating, cooling, defrost, humidity};
  }
  if (body && path.endsWith("/preference")) {
    const name = path.split("/")[2];
    const z = S.zones.find((x) => x.name === name);
    z.preferences[body.profile] = {temperature: body.temperature, source: "zone"};
    return S;
  }
  if (body && path.endsWith("/override-temp")) {
    const name = path.split("/")[2];
    const z = S.zones.find((x) => x.name === name);
    z.override_temps = {temperature: body.temperature, source: "zone"};
    return S;
  }
  if (body && path.endsWith("/override")) {
    const name = path.split("/")[2];
    const z = S.zones.find((x) => x.name === name);
    z.override_until = now + body.hours * 3600;
    if (body.temperature != null) z.override_temps = {temperature: body.temperature, source: "zone"};
    return S;
  }
  if (path.endsWith("/resume-all") || path.endsWith("/resume")) {
    const names = path.endsWith("/resume-all") ? S.zones.map((z) => z.name) : [path.split("/")[2]];
    for (const n of names) { const z = S.zones.find((x) => x.name === n); if (z) z.override_until = null; }
    return S;
  }
  if (body && body.profile && path.endsWith("/profile")) S.profile = body.profile;
  return S;
}
function mockState(now){
  const holdA = now + 2 * 3600, holdB = now + 2 * 3600 + 30;
  const pause = new URLSearchParams(location.search).has("pause");
  const pref = (n) => ({home:{temperature:n, source:"zone"}, sleep:{temperature:n - 3, source:"schedule"},
    away_heat:{temperature:65, source:"schedule"}, away_cool:{temperature:78, source:"schedule"}});
  const live = (sp, indoor) => ({mode: pause ? "off" : "heat", setpoint:sp, indoor, humidity:41,
    hvac_action: pause ? "off" : "heating", fan_mode:"auto"});
  const why = pause ? "window_slope_pause" : "manual_override";
  return {enabled:true, dry_run:false, profile:"auto", override_hours:2, radiant_setpoint_max:85, vacation:false,
    last:{ts:now - 180, presence_home:true, outdoor:34, zones:{
      room_a:{profile:"away", reason:why, setpoint:70, action:"hold", next:null, live:live(70, 68.4), defrosting:false},
      room_b:{profile:"away", reason:why, setpoint:70, action:"hold", next:null, live:live(70, 69.1), defrosting:false},
      bath_floor:{profile:"home", reason:"no_change", setpoint:72, action:"hold", next:{ts:now + 6 * 3600, setpoint:66, profile:"sleep"}, live:{mode:"heat", setpoint:72, indoor:71.2, hvac_action:"idle"}}
    }},
    preferences:{room_a:pref(71), room_b:pref(71), bath_floor:pref(72)},
    zones:[
      {name:"room_a", label:"Room A", heat_only:false, override_until:holdA, override_temps:{temperature:70, source:"zone"}, preferences:pref(71)},
      {name:"room_b", label:"Room B", heat_only:false, override_until:holdB, override_temps:{temperature:null, source:"unset"}, preferences:pref(71)},
      {name:"bath_floor", label:"Bath floor", heat_only:true, override_until:null, override_temps:{temperature:null, source:"unset"}, preferences:pref(72)}
    ]};
}
boot();
setInterval(() => { if (S) render(); }, 30000);
</script>
