name: Smart HVAC
version: "0.9.5"
slug: smart_hvac
description: Smart thermostat for multi-zone mini-split systems. All heads share one outdoor unit, so they are always kept in the same heat/cool mode. Presence-, weather- and sun-aware, plus radiant floor (Ingress panel)
url: https://github.com/bcart180/ha-addons-public/tree/main/smart_hvac
arch:
  - aarch64
  - amd64
init: false
# Sidebar panel behind the HA login. No host ports. Never public.
ingress: true
ingress_panel: true
panel_icon: mdi:thermostat-auto
panel_title: Climate
# Health (0.7.6): the Dockerfile HEALTHCHECK probes http://127.0.0.1:8099/api/health. That endpoint answers from
# the event loop only, so an HA outage or a slow control cycle cannot make it fail. ('watchdog' is obsolete.)
# panel_admin omitted: Supervisor default is true (admin-only panel, MA M2); linter rejects the explicit default.
homeassistant_api: true
options:
  # SAFE ON INSTALL: master off + dry run. Go-live is a separate GO after MA review.
  enabled: false
  dry_run: true
  log_level: info
  interval_s: 300
  # Occupancy = anyone listed is home (e.g. device_tracker.person_a_phone, person.person_b).
  # No house entities ship as defaults: set these in the add-on Configuration tab.
  presence_entities: []
  weather_entity: ""
  forecast_entity: ""
  min_cycle_min: 15
  override_hours: 2
  # Heat-pump defrost: reported hvac_action, or inferred when a head only reports heating/idle.
  # false restores the previous short-cycle and setpoint-chase behavior.
  defrost_aware: true
  # Open-window pause from the room sensor's 20-minute temperature slope. Radiant zones are excluded.
  # false restores 0.9.4 (contact sensors only). Per-zone window_slope_* keys override the defaults.
  window_slope: true
  # Bath radiant: floor setpoint cap 85, air shutoff 80 (owner, 30 Oct).
  radiant_setpoint_max: 85
  radiant_air_shutoff: 80
  radiant_floor_cap: 85
  # Vacation (input_boolean.vacation_mode on): mini splits set back to these; radiant stays off.
  vacation_heat: 60
  vacation_cool: 82
  profiles:
    home: 71
    guest: 71
    sleep: 68
    away_heat: 65
    away_cool: 78
    sleep_start: "22:00"
    wake: "07:00"
  # No house entities ship as defaults: add your zones in the Configuration tab (example in DOCS.md).
  # With no zones the add-on runs and controls nothing.
  zones: []
  # 0.8.0 spare bathroom heater (smart plug + space heater). Blank = zone disabled. Independent of the splits.
  spare_bathroom:
    # 0.8.1 heater-only gates, independent of the global ones. ON needs all four to allow it.
    enabled: false
    dry_run: true
    heater_switch: ""
    temp_sensor: ""
    power_sensor: ""
    door_sensor: ""
    notify_service: ""
    motion_sensor: ""
    # 0.8.2: minutes without a sensor report before the heater fails off. Optional last_seen_sensor (Z-Wave last seen).
    stale_minutes: 75
    last_seen_sensor: ""
    low_warn_f: 62
    low_warn_min: 10
    low_crit_f: 58
    low_crit_repeat_min: 30
schema:
  enabled: bool
  dry_run: bool
  log_level: list(debug|info|warning|error)
  interval_s: int(60,3600)
  presence_entity: match(^(device_tracker|person)\.[a-z0-9_]+$)?
  presence_entities:
    - match(^(device_tracker|person)\.[a-z0-9_]+$)
  weather_entity: str?
  forecast_entity: str?
  min_cycle_min: int(5,60)
  override_hours: float(0.5,12)
  cool_lockout: float(55,95)?
  radiant_room_cap: float(70,85)?
  radiant_setpoint_max: float(60,85)
  radiant_air_shutoff: float(70,85)
  radiant_floor_cap: float(70,95)
  vacation_heat: float(50,68)?
  vacation_cool: float(76,90)?
  defrost_aware: bool
  window_slope: bool?
  learned_preheat: bool?
  away_delay_min: int(0,120)?
  sleep_coast_max_min: int(0,180)?
  forecast_anticipation: bool?
  profiles:
    home: float(60,80)
    guest: float(60,80)
    sleep: float(58,78)
    away_heat: float(50,70)
    away_cool: float(72,86)
    sleep_start: match(^\d{2}:\d{2}$)
    wake: match(^\d{2}:\d{2}$)
  zones:
    - name: match(^[a-z0-9_]+$)
      label: str
      climate: str
      setpoint_climate: match(^climate\.[a-z0-9_]+$)?
      indoor: str?
      humidity: str?
      indoor_stale_min: int(0,1440)?
      floor: str?
      window: match(^binary_sensor\.[a-z0-9_]+$)?
      window_action: list(off|fan_only|eco)?
      window_open_delay_s: int(0,3600)?
      window_close_delay_s: int(0,3600)?
      window_slope_threshold_f_per_h: float(2,15)?
      window_slope_delay_s: int(0,1800)?
      window_slope_max_min: int(5,120)?
      window_slope_lookback_min: int(10,60)?
      facing_az: int(0,359)
      solar_factor: float(0,1)
      heat_only: bool
      heat_pump: bool?
      enabled: bool
      comfort: float(50,80)?
      sleep: float(50,80)?
      away: float(45,75)?
  spare_bathroom:
    enabled: bool?
    dry_run: bool?
    heater_switch: str?
    temp_sensor: str?
    power_sensor: str?
    door_sensor: str?
    notify_service: str?
    motion_sensor: str?
    stale_minutes: int(15,120)?
    last_seen_sensor: str?
    low_warn_f: float(50,70)?
    low_warn_min: int(1,120)?
    low_crit_f: float(45,65)?
    low_crit_repeat_min: int(5,240)?
    label: str?
